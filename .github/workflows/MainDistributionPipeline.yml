#
# This workflow calls the main distribution pipeline from DuckDB to build, test and (optionally) release the extension
#
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5.4
    with:
      duckdb_version: v1.5.4
      ci_tools_version: v1.5.4
      extension_name: three_d
      # MinGW's ld cannot dedupe DuckDB's static LogicalType constants (e.g.
      # LogicalType::DOUBLE), producing "multiple definition" link errors. This
      # is a known DuckDB toolchain quirk, not an extension issue — exclude it.
      exclude_archs: 'windows_amd64_mingw'

  code-quality-check:
    name: Code Quality Check
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_code_quality.yml@v1.5.4
    with:
      duckdb_version: v1.5.4
      ci_tools_version: v1.5.4
      extension_name: three_d
      # Format only — the tidy pass runs in the local job below.
      format_checks: 'format'

  # ST_3DTransform links PROJ (CMakeLists.txt find_package(PROJ CONFIG REQUIRED)),
  # declared in vcpkg.json. The distribution workflow builds under the vcpkg
  # toolchain and resolves it; _extension_code_quality.yml's tidy job installs
  # only ninja and clang-tidy, runs no vcpkg step, and exposes no input to add a
  # dependency — so `make tidy-check` cannot get past CMake configure there.
  # Running it here lets us install PROJ first. Keep the environment in step with
  # upstream's tidy job when bumping ci_tools_version.
  tidy-check:
    name: Tidy Check
    runs-on: ubuntu-24.04

    env:
      CC: gcc
      CXX: g++
      GEN: ninja
      TIDY_THREADS: 4

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - name: Install
        shell: bash
        run: |
          sudo apt-get update -y -qq
          sudo apt-get install -y -qq ninja-build clang-tidy libproj-dev
          sudo pip3 install pybind11[global] --break-system-packages

      - name: Tidy Check Diff
        shell: bash
        run: make tidy-check
